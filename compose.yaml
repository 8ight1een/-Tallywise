services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: tallywise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      POSTGRES_DB: tallywise
    command: ["postgres", "-c", "timezone=Asia/Shanghai"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tallywise -d tallywise"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: tallywise
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD_required}
      DATABASE_NAME: tallywise
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY_required}
      COOKIE_SECURE: "false"
      SQL_ECHO: "false"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
