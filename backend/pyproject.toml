[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "SIM", "PLW", "FURB", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"routers/items.py" = ["BLE001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "config"
disable_error_code = ["call-arg"]
