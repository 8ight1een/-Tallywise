name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tallywise
          POSTGRES_PASSWORD: tallywise_ci
          POSTGRES_DB: tallywise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallywise -d tallywise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_NAME: tallywise_test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: tallywise
      DATABASE_PASSWORD: tallywise_ci
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy .

      - name: 迁移一致性
        env:
          DATABASE_NAME: tallywise_test
        run: |
          alembic upgrade head
          alembic check

      - name: pytest
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 检查
        run: npm run lint:ci

      - name: 构建
        run: npm run build

  frontend-react:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 检查
        run: npm run lint

      - name: 测试
        run: npm run test

      - name: 构建
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tallywise
          POSTGRES_PASSWORD: tallywise_ci
          POSTGRES_DB: tallywise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tallywise -d tallywise_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_NAME: tallywise_test
      DATABASE_HOST: localhost
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: tallywise
      DATABASE_PASSWORD: tallywise_ci
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: 安装后端依赖
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: 迁移
        working-directory: backend
        run: alembic upgrade head

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend-react
        run: npm ci

      - name: 安装浏览器
        working-directory: frontend-react
        run: npx playwright install --with-deps chromium

      - name: 端到端测试
        working-directory: frontend-react
        run: npm run test:e2e

      - name: 上传测试产物
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend-react/playwright-report
            frontend-react/test-results
          retention-days: 7
