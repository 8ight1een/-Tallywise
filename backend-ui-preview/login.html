<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f3">
  <meta name="description" content="Tallywise 登录页面静态设计。">
  <title>登录 · Tallywise</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f3;
      --paper: #fff;
      --ink: #23352f;
      --muted: #748078;
      --line: #e5eae1;
      --green: #23674f;
      --lime: #dcecbe;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 "Segoe UI", "Microsoft YaHei", sans-serif; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid #8bb28c; outline-offset: 4px; }
    .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
    .symbols { position: absolute; width: 0; height: 0; overflow: hidden; }
    .page { min-height: 100svh; display: flex; flex-direction: column; padding: 32px 48px 20px; }
    .topbar { width: 100%; max-width: 1320px; margin: 0 auto 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 750; letter-spacing: -1px; text-decoration: none; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 35px; border-radius: 10px; background: var(--green); color: #e4efce; }
    .brand-mark .icon { width: 25px; height: 25px; }
    .brand-dot { color: #8fa46d; }
    .shell { width: 100%; max-width: 1320px; margin: auto; display: grid; grid-template-columns: 1.08fr 1fr; min-height: 704px; border: 1px solid var(--line); border-radius: 26px; overflow: hidden; background: var(--paper); box-shadow: 0 12px 50px #23352f05; }
    .story { position: relative; isolation: isolate; padding: 54px 54px 32px; background: #eaf0df; display: flex; flex-direction: column; overflow: hidden; }
    .story::before { content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; border: 1px solid #d7e2ca; border-radius: 50%; left: -205px; bottom: -240px; box-shadow: 0 0 0 30px #eaf0df, 0 0 0 31px #dce5d0, 0 0 0 61px #eaf0df, 0 0 0 62px #dce5d0; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: #657c5f; font-size: 10px; letter-spacing: 2.5px; font-weight: 600; }
    .eyebrow::before { content: ""; width: 5px; height: 5px; background: #78996d; border-radius: 50%; }
    .story h2 { margin: 23px 0 16px; font-size: clamp(34px, 3.2vw, 46px); line-height: 1.5; letter-spacing: 2px; font-weight: 600; }
    .story h2 span { color: var(--green); }
    .story-copy { color: #6d7c66; line-height: 2; font-size: 13px; margin: 0; }
    .story-footer { margin-top: auto; display: flex; align-items: center; gap: 12px; color: #72816a; font-size: 11px; }
    .story-footer .icon { width: 25px; height: 25px; color: #7c986b; }
    .story-footer span { display: block; }
    .story-footer b { display: block; font-weight: 500; color: #50664a; font-size: 12px; }
    .login { display: flex; flex-direction: column; justify-content: center; padding: 58px 64px; }
    .login-inner { width: 100%; max-width: 360px; margin: 0 auto; }
    .welcome-icon { display: grid; place-items: center; width: 44px; height: 44px; background: #f0f5e9; color: var(--green); border: 1px solid #e7eedc; border-radius: 13px; margin-bottom: 26px; }
    .welcome-icon .icon { width: 23px; height: 23px; }
    h1 { font-size: 30px; line-height: 1.45; font-weight: 650; letter-spacing: .6px; margin: 0 0 9px; }
    .subtitle { margin: 0 0 33px; font-size: 13px; color: var(--muted); }
    .field { margin-bottom: 21px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 9px; }
    .input-wrap { position: relative; }
    .input-wrap > .icon { position: absolute; top: 17px; left: 15px; color: #91a08f; width: 17px; height: 17px; pointer-events: none; }
    .input-wrap input { width: 100%; height: 51px; padding: 0 16px 0 43px; border: 1px solid #e0e6db; border-radius: 9px; background: #fcfdf9; color: var(--ink); font-size: 13px; transition: border-color .2s, background .2s; }
    input::placeholder { color: #8a9587; opacity: 1; }
    .input-wrap input:focus { border-color: #769a78; background: #fff; }
    .text-button { padding: 0; border: 0; background: none; color: var(--green); font-size: 12px; }
    .text-button:hover { text-decoration: underline; text-underline-offset: 4px; }
    .login-button { width: 100%; min-height: 49px; padding: 12px 20px; border: 1px solid var(--green); border-radius: 9px; background: var(--green); color: white; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 13px; font-weight: 600; letter-spacing: 1px; transition: background .2s, transform .2s; }
    .login-button:hover { background: #194f3d; }
    .login-button:active { transform: translateY(1px); }
    .login-button .icon { width: 17px; height: 17px; }
    .register { text-align: center; margin: 24px 0 0; color: var(--muted); font-size: 12px; }
    .register .text-button { margin-left: 5px; font-weight: 600; }
    .quiet-note { display: flex; align-items: center; justify-content: center; gap: 7px; padding-top: 25px; margin: 30px 0 0; border-top: 1px solid #edf0e8; color: #82907b; font-size: 11px; }
    .quiet-note .icon { width: 14px; height: 14px; }
    .page-footer { max-width: 1320px; width: 100%; margin: 21px auto 0; display: flex; justify-content: space-between; gap: 12px; font-size: 10px; color: #7a857e; letter-spacing: .4px; }
    @media (min-width: 1500px) { .page { padding-top: 42px; padding-bottom: 28px; } .shell { min-height: 760px; } .story { padding: 64px 62px 42px; } }
    @media (max-width: 1050px) { .page { padding: 26px 28px 18px; } .story { padding: 42px 32px 28px; } .login { padding: 42px 36px; } .shell { min-height: 660px; } }
    @media (max-width: 760px) {
      .page { padding: 23px 20px 19px; }
      .topbar { margin-bottom: 24px; }
      .brand { font-size: 22px; }
      .shell { display: flex; flex-direction: column; min-height: auto; max-width: 520px; border-radius: 20px; }
      .story { padding: 28px 28px 25px; }
      .story h2 { font-size: 28px; line-height: 1.45; margin: 12px 0 9px; letter-spacing: 1px; }
      .story h2 br { display: none; }
      .story-copy { font-size: 12px; }
      .story-copy br { display: none; }
      .eyebrow { font-size: 9px; }
      .story-footer { display: none; }
      .login { padding: 33px 28px 30px; }
      .welcome-icon { display: none; }
      h1 { font-size: 25px; }
      .subtitle { font-size: 12px; margin-bottom: 26px; }
      .quiet-note { margin-top: 25px; padding-top: 20px; }
      .page-footer { max-width: 520px; font-size: 9px; }
    }
    @media (max-width: 360px) { .page { padding: 18px 14px; } .story, .login { padding-left: 22px; padding-right: 22px; } .story h2 { font-size: 25px; } .page-footer { flex-wrap: wrap; justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M5 6h14M5 12h10M5 18h6" stroke-width="2.3"/><path d="m14 17 3 3 5-6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M19 3C9 2 3 6 5 14c1 4 6 5 10 2 4-3 4-8 4-13ZM4 21 15 9"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4V4Zm10 3a3 3 0 0 1 3-3h4v15h-3a4 4 0 0 0-4 2M7 8h3M7 12h3"/></symbol>
  </svg>
  <div class="page">
    <header class="topbar">
      <div class="brand" aria-label="Tallywise">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-logo"/></svg></span>
        <span>tallywise<span class="brand-dot">.</span></span>
      </div>
    </header>

    <main class="shell">
      <section class="story" aria-labelledby="story-title">
        <div class="eyebrow">A LITTLE CLARITY, EVERY DAY</div>
        <h2 id="story-title">把日子，<br><span>记得清楚。</span></h2>
        <p class="story-copy">一杯咖啡，一次出发，一点小小的积累。<br>让每一笔收支，都成为生活有迹可循的一部分。</p>

        <div class="story-footer"><svg class="icon" aria-hidden="true"><use href="#i-leaf"/></svg><div><b>从一笔记录，慢慢开始。</b><span>不用复杂的计划，也能让生活更有数。</span></div></div>
      </section>

      <section class="login" aria-labelledby="login-title">
        <div class="login-inner">
          <div class="welcome-icon"><svg class="icon" aria-hidden="true"><use href="#i-book"/></svg></div>
          <h1 id="login-title">欢迎回来。</h1>
          <p class="subtitle">登录你的账本，接着记录生活。</p>

          <!-- 仅展示登录界面：没有表单提交、认证请求或密码存储。 -->
          <div class="field">
            <label for="email">邮箱地址</label>
            <div class="input-wrap"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg><input id="email" type="email" placeholder="you@example.com" autocomplete="off" spellcheck="false" autocapitalize="none"></div>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <div class="input-wrap"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg><input id="password" type="password" placeholder="请输入你的密码" autocomplete="off"></div>
          </div>
          <button class="login-button" type="button">登 录<svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button>
          <p class="register">还没有账户？<button class="text-button" type="button">创建一个新账户</button></p>
          <p class="quiet-note"><svg class="icon" aria-hidden="true"><use href="#i-leaf"/></svg>每一天，都可以从一笔记录开始。</p>
        </div>
      </section>
    </main>

    <footer class="page-footer"><span>© 2026 Tallywise</span><span>简单记账 · 有数生活</span></footer>
  </div>
</body>
</html>
